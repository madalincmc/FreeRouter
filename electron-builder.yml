appId: com.freerouter.desktop
productName: FreeRouter
copyright: Copyright © 2026 FreeRouter
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.{map,md,ts,tsx}'
  # better-sqlite3 ships sources and prebuilds for every platform; keep only the Windows x64 binary.
  - '!**/node_modules/better-sqlite3/{deps,src,docs,benchmark,build}/**'
  - '!**/node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*.node'
  - '!**/node_modules/better-sqlite3/prebuilds/win32-arm64.node'
asarUnpack:
  - '**/*.node'
# English UI only: drop the other ~50 MB of Chromium locales.
electronLanguages:
  - en-US
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
nsis:
  # No spaces: GitHub rewrites spaces in asset names, which would break the URL in latest.yml.
  artifactName: FreeRouter-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FreeRouter
  runAfterFinish: true
# Auto-update feed. electron-builder writes app-update.yml into the app from this, and
# `--publish always` uploads the installer, its .blockmap and latest.yml to a GitHub Release.
# electron-updater needs the releases to be publicly readable (no token ships in the app).
publish:
  provider: github
  owner: madalincmc
  repo: FreeRouter
  releaseType: release
# better-sqlite3 ships N-API prebuilds that load in both Node and Electron; no rebuild needed
# (and node-gyp source builds fail when the path contains a space).
npmRebuild: false
