# Builds the Windows installer and publishes it as a GitHub Release when a version tag is pushed.
# Release flow: bump "version" in package.json, commit, `git tag v<version>`, `git push --follow-tags`.
# Installed copies then pick the release up through latest.yml (electron-updater).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag matches package.json version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $v"
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm test

      # electron-builder only builds here (--publish never). Its own GitHub publisher ran two
      # uploaders concurrently and created two releases for one tag, so gh uploads all three files
      # to a single release instead. The `publish` block in electron-builder.yml is still needed:
      # it produces app-update.yml (the feed URL inside the app) and latest.yml.
      - name: Build
        run: pnpm package

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --title "$v" --generate-notes \
            "dist/FreeRouter-Setup-$v.exe" \
            "dist/FreeRouter-Setup-$v.exe.blockmap" \
            "dist/latest.yml"
